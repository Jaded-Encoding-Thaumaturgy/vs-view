name: Build Python
on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      python-version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      matrix:
        required: true
        type: string
        default: '[{"tag": "vsview", "package": "vsview", "path": ".", "build_args": "--sdist --wheel"}]'
        description: |
          JSON output from resolve_package.py

          Examples:

          - [{"tag": "vsview", "package": "vsview", "path": ".", "build_args": "--sdist --wheel"}]
          - [{"tag": "comp", "package": "vsview-comp", "path": "src/plugins/comp", "build_args": "--wheel"}]
      python-version:
        required: false
        type: string
        default: "3.14"

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(inputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: false

      - name: Build
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: uv build --package "${{ matrix.package }}" ${{ matrix.build_args }} --out-dir dist --clear

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ matrix.package }}
          path: dist/
