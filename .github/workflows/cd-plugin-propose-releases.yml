name: Propose Plugin Releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect pending releases
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.detect.outputs.plugins }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect plugin changes
        id: detect
        run: |
          python .github/scripts/detect_plugin_releases.py || exit_code=$?

          if [ "${exit_code:-0}" -eq 2 ]; then
            echo "No plugins need releasing."
            echo "plugins=[]" >> "$GITHUB_OUTPUT"
          elif [ "${exit_code:-0}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload PR bodies
        if: steps.detect.outputs.plugins != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-bodies
          path: .github/releases/*.md

  open-prs:
    name: PR for ${{ matrix.plugin }}
    needs: [detect]
    if: needs.detect.outputs.plugins != '[]'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    strategy:
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.plugins) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download PR bodies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-bodies
          path: release-bodies/

      - name: Create release PR
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN: ${{ matrix.plugin }}
        run: |
          branch="auto/release-${PLUGIN}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git commit --allow-empty -m "release: ${PLUGIN}"
          git push -f origin "$branch"

          existing=$(gh pr list --head "$branch" --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh pr edit "$existing" \
              --body-file "release-bodies/${PLUGIN}.md"
          else
            gh pr create \
              --title "release: ${PLUGIN}" \
              --body-file "release-bodies/${PLUGIN}.md" \
              --label release
          fi
