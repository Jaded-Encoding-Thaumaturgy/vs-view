name: Tests

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "**/pyproject.toml"
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/ci-test.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "**/pyproject.toml"
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/ci-test.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        description: "Package to test"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-python:
    name: Test build
    strategy:
      fail-fast: false
      matrix:
        runner: ["ubuntu-latest", "windows-latest", "macos-latest"]

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Build Packages
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: uv build --all-packages --quiet

      - name: Post webhook for failure
        if: failure()
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@91fe776034ecf9ce8da83bfe4074e7af12e43c9f # v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}

  test-python:
    name: Test Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    env:
      UV_NO_SYNC: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-xtest0 \
            libxcb-cursor0 \
            libpulse0 \
            xvfb

      - name: Install dependencies
        run: uv sync --locked --group test --group plugins --no-dev

      - name: Set package argument
        id: setup-pkg
        run: |
          if [ -n "${{ inputs.package }}" ]; then
            echo "package_arg=--package ${{ inputs.package }}" >> $GITHUB_OUTPUT
          else
            echo "package_arg=" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        env:
          QT_DEBUG_PLUGINS: 1
        run: uv run ${{ steps.setup-pkg.outputs.package_arg }} pytest

      - name: Post webhook for failure
        if: failure()
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@91fe776034ecf9ce8da83bfe4074e7af12e43c9f # v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}

  test-ts:
    name: Test TypeScript
    if: ${{ !inputs.package || inputs.package == 'vsview' || inputs.package == 'vsview-editor' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/workspaces/editor

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/workspaces/editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test

      - name: Build frontend bundle
        run: npm run build

      - name: Post webhook for failure
        if: failure()
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@91fe776034ecf9ce8da83bfe4074e7af12e43c9f # v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
