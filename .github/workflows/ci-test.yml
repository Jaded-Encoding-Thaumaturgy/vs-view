name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - '**/pyproject.toml'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/ci-test.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '**/pyproject.toml'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/ci-test.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        description: 'Package to test'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-python:
    name: Test build
    strategy:
      fail-fast: false
      matrix:
        runner: ['ubuntu-26.04', 'windows-latest', 'macos-latest']

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
          cache: true

      - name: Build Packages
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: uv build --all-packages --quiet --sdist --wheel

      - name: Post webhook for failure
        if: failure()
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@0abb7fddabf2daa28da23b654ca8290e96294064 # v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}

  test-python:
    name: Test Python (${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']

    env:
      UV_NO_SYNC: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libegl1 \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-xtest0 \
            libxcb-cursor0 \
            libpulse0 \
            xvfb

      - name: Install dependencies
        run: uv sync --locked --group test --group plugins --no-dev

      - name: Set package argument
        id: setup-pkg
        run: |
          if [ -n "${{ inputs.package }}" ]; then
            echo "package_arg=--package ${{ inputs.package }}" >> $GITHUB_OUTPUT
          else
            echo "package_arg=" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        env:
          QT_AUDIO_BACKEND: null
          QT_DEBUG_PLUGINS: 1
        run: uv run ${{ steps.setup-pkg.outputs.package_arg }} pytest

      - name: Post webhook for failure
        if: failure()
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@0abb7fddabf2daa28da23b654ca8290e96294064 # v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}

  test-ts:
    name: Test TypeScript
    if: ${{ !inputs.package || inputs.package == 'vsview' || inputs.package == 'vsview-editor' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check for vsview-editor changes
        if: ${{ !inputs.package }}
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            vsview-editor:
              - 'src/workspaces/editor/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'vite.config.ts'
              - '.github/workflows/ci-test.yml'

      - name: Set up Vite+
        if: ${{
          inputs.package == 'vsview' ||
          inputs.package == 'vsview-editor' ||
          github.event_name == 'workflow_dispatch' ||
          steps.filter.outputs.vsview-editor == 'true'
          }}
        id: node
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
          cache: true

      - name: Run vitest
        if: ${{ steps.node.conclusion == 'success' }}
        run: vp test

      - name: Build frontend bundle
        if: ${{ steps.node.conclusion == 'success' }}
        run: vp -C src/workspaces/editor build

      - name: Post webhook for failure
        if: failure()
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@0abb7fddabf2daa28da23b654ca8290e96294064 # v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}

  test-rust:
    strategy:
      fail-fast: false
      matrix:
        package: [vspackrgb, vsview-histogram]
        runner: [ubuntu-26.04, windows-latest, macos-latest]
        include:
          - package: vspackrgb
            path: src/vspackrgb/src/rust
          - package: vsview-histogram
            path: src/plugins/histogram/src/rust

    name: Test Rust (${{ matrix.package }} on ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}

    if: ${{ !inputs.package || inputs.package == 'vspackrgb' || inputs.package == 'vsview-histogram' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check for package changes
        if: ${{ !inputs.package }}
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            changed:
              - 'src/${{ matrix.package }}/**'
              - '.github/workflows/ci-test.yml'

      - name: Run cargo test
        if: ${{ inputs.package == matrix.package || steps.filter.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
        working-directory: ${{ matrix.path }}
        run: cargo test -- --nocapture

      - name: Post webhook for failure
        if: failure()
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@0abb7fddabf2daa28da23b654ca8290e96294064 # v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
