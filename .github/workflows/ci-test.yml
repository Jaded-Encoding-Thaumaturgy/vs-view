name: Tests

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "**/pyproject.toml"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/ci-test.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "**/pyproject.toml"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/ci-test.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        description: "Package to test"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-python:
    name: Test build
    strategy:
      fail-fast: false
      matrix:
        runner: ["ubuntu-latest", "windows-latest", "macos-latest"]

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Build Packages
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: uv build --all-packages --quiet

      - name: Post webhook for failure
        if: failure()
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@0abb7fddabf2daa28da23b654ca8290e96294064 # v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}

  test-python:
    name: Test Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    env:
      UV_NO_SYNC: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-xtest0 \
            libxcb-cursor0 \
            libpulse0 \
            xvfb

      - name: Install dependencies
        run: uv sync --locked --group test --group plugins --no-dev

      - name: Set package argument
        id: setup-pkg
        run: |
          if [ -n "${{ inputs.package }}" ]; then
            echo "package_arg=--package ${{ inputs.package }}" >> $GITHUB_OUTPUT
          else
            echo "package_arg=" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        env:
          QT_DEBUG_PLUGINS: 1
        run: uv run ${{ steps.setup-pkg.outputs.package_arg }} pytest

      - name: Post webhook for failure
        if: failure()
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@0abb7fddabf2daa28da23b654ca8290e96294064 # v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}

  test-ts:
    name: Test TypeScript
    if: ${{ !inputs.package || inputs.package == 'vsview' || inputs.package == 'vsview-editor' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/workspaces/editor

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check for vsview-editor changes
        if: ${{ !inputs.package }}
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            vsview-editor:
              - 'src/workspaces/editor/**'
              - '.github/workflows/ci-test.yml'

      - name: Set up Node.js
        if: ${{
          inputs.package == 'vsview' ||
          inputs.package == 'vsview-editor' ||
          github.event_name == 'workflow_dispatch' ||
          steps.filter.outputs.vsview-editor == 'true'
          }}
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/workspaces/editor/package-lock.json

      - name: Install dependencies
        if: ${{ steps.node.conclusion == 'success' }}
        run: npm ci

      - name: Run vitest
        if: ${{ steps.node.conclusion == 'success' }}
        run: npm test

      - name: Build frontend bundle
        if: ${{ steps.node.conclusion == 'success' }}
        run: npm run build

      - name: Post webhook for failure
        if: failure()
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@0abb7fddabf2daa28da23b654ca8290e96294064 # v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}

  test-rust:
    strategy:
      fail-fast: false
      matrix:
        package: [vspackrgb, vsview-histogram]
        runner: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - package: vspackrgb
            path: src/vspackrgb/src/rust
          - package: vsview-histogram
            path: src/plugins/histogram/src/rust

    name: Test Rust (${{ matrix.package }} on ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}

    if: ${{ !inputs.package || inputs.package == 'vspackrgb' || inputs.package == 'vsview-histogram' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check for package changes
        if: ${{ !inputs.package }}
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            changed:
              - 'src/${{ matrix.package }}/**'
              - '.github/workflows/ci-test.yml'

      - name: Run cargo test
        if: ${{ inputs.package == matrix.package || steps.filter.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
        working-directory: ${{ matrix.path }}
        run: cargo test -- --nocapture

      - name: Post webhook for failure
        if: failure()
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@0abb7fddabf2daa28da23b654ca8290e96294064 # v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
