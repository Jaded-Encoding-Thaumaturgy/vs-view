name: Update Submodules & Icons

on:
  schedule:
    # 1st and 15th of the month at 14:00
    - cron: "0 14 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.repository_owner == 'Jaded-Encoding-Thaumaturgy'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update submodules
        run: git submodule update --remote --merge

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Sync icons from submodules
        run: python scripts/sync_icons.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore: update submodules and sync icons"
          title: "chore: update submodules and sync icons"
          body: |
            Automated bi-weekly update of icon submodules and synced SVG assets.
          branch: auto/update-submodules
          delete-branch: true
          labels: dependencies
