name: Lint

on:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "**/pyproject.toml"
      - "**.ts"
      - "**.tsx"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/tsconfig.json"
      - ".oxfmtrc.json"
      - "**/.oxlintrc.json"
      - ".github/workflows/ci-lint.yml"
  pull_request:
    paths:
      - "**.py"
      - "**/pyproject.toml"
      - "**.ts"
      - "**.tsx"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/tsconfig.json"
      - ".oxfmtrc.json"
      - "**/.oxlintrc.json"
      - ".github/workflows/ci-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_NO_SYNC: "1"

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups --all-packages

      - name: Run Ruff check
        id: ruff-check
        run: uv run ruff check .

      - name: Run Ruff format
        id: ruff-format
        if: success() || (failure() && steps.ruff-check.conclusion == 'failure')
        run: uv run ruff format --check --diff

      - name: Running mypy
        if: success() || (failure() && (steps.ruff-check.conclusion == 'failure' || steps.ruff-format.conclusion == 'failure'))
        run: uv run mypy .

      - name: Post webhook for failure
        if: failure()
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@fb70088dc5982abfac889fdded8603be4f5823b6 # v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}

  lint-ts:
    name: Lint TypeScript
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/workspaces/editor

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/workspaces/editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        id: oxlint
        run: npm run lint

      - name: Run oxfmt check
        id: oxfmt
        if: success() || (failure() && steps.oxlint.conclusion == 'failure')
        run: npm run format-check

      - name: Run tsc typecheck
        if: success() || (failure() && (steps.oxlint.conclusion == 'failure' || steps.oxfmt.conclusion == 'failure'))
        run: npx tsc --noEmit

      - name: Post webhook for failure
        if: failure()
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@fb70088dc5982abfac889fdded8603be4f5823b6 # v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
