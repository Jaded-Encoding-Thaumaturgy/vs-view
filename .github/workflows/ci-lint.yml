name: Lint

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - '**/pyproject.toml'
      - 'uv.lock'
      - '**.ts'
      - '**.tsx'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '**/tsconfig.json'
      - 'vite.config.ts'
      - '**/vite.config.ts'
      - '.github/workflows/ci-lint.yml'
  pull_request:
    paths:
      - '**.py'
      - '**/pyproject.toml'
      - 'uv.lock'
      - '**.ts'
      - '**.tsx'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '**/tsconfig.json'
      - 'vite.config.ts'
      - '**/vite.config.ts'
      - '.github/workflows/ci-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_NO_SYNC: '1'

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 24
          cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups --all-packages

      - name: Run Ruff check
        id: ruff-check
        run: uv run ruff check .

      - name: Run Ruff format
        id: ruff-format
        if: success() || (failure() && steps.ruff-check.conclusion == 'failure')
        run: uv run ruff format --check --diff

      - name: Running mypy
        if: success() || (failure() && (steps.ruff-check.conclusion == 'failure' || steps.ruff-format.conclusion == 'failure'))
        run: uv run mypy .

      - name: Post webhook for failure
        if: failure()
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@0abb7fddabf2daa28da23b654ca8290e96294064 # v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}

  lint-ts:
    name: Lint TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 24
          cache: true

      - name: Run vp check
        run: vp check

      - name: Post webhook for failure
        if: failure()
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@0abb7fddabf2daa28da23b654ca8290e96294064 # v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
