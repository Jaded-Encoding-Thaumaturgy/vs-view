name: Build JS frontend packages

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      python-version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      package:
        required: true
        type: string
        default: 'vsview-editor'
      python-version:
        required: false
        type: string
        default: '3.14'

jobs:
  build:
    name: Build ${{ inputs.package }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
          cache: true

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.python-version }}

      - name: Build
        env:
          PACKAGE: ${{ inputs.package }}
        run: uv build --package "$PACKAGE" --sdist --wheel --out-dir dist --clear

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ inputs.package }}
          path: dist/
