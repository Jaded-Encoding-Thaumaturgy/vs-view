name: Publish
on:
  push:
    tags:
      - "*/v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package or tag prefix to build"
        required: true
        type: choice
        options:
          - vsview
          - vspackrgb
          - audio-convert
          - comp
          - editor
          - fftspectrum
          - frameprops-extended
          - histogram
          - remote
          - split-planes

env:
  VSVIEW_PYTHON_VERSION: "3.14"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      build-workflow: ${{ steps.check.outputs.build-workflow }}
      package: ${{ steps.check.outputs.package }}
      package-dir: ${{ steps.check.outputs.package-dir }}
      python-version: ${{ env.VSVIEW_PYTHON_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: check
        run: python .github/scripts/resolve_package.py
        env:
          INPUT_PACKAGE: ${{ inputs.package }}

  # Build Jobs
  python-build:
    needs: [prepare]
    if: needs.prepare.outputs.build-workflow == 'python'
    uses: ./.github/workflows/cd-build-python.yml
    with:
      matrix: ${{ needs.prepare.outputs.matrix }}
      python-version: ${{ needs.prepare.outputs.python-version }}

  wheels-build:
    needs: [prepare]
    if: needs.prepare.outputs.build-workflow == 'wheels'
    uses: ./.github/workflows/cd-build-wheels.yml
    with:
      package: ${{ needs.prepare.outputs.package }}
      package-dir: ${{ needs.prepare.outputs.package-dir }}
      python-version: ${{ needs.prepare.outputs.python-version }}

  vsview-editor-build:
    needs: [prepare]
    if: needs.prepare.outputs.build-workflow == 'editor'
    uses: ./.github/workflows/cd-build-vsview-editor.yml
    with:
      python-version: ${{ needs.prepare.outputs.python-version }}

  # Centralized Publish Job
  publish:
    name: Publish ${{ needs.prepare.outputs.package }} to PyPI
    needs: [prepare, python-build, wheels-build, vsview-editor-build]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment:
      name: pypi-${{ needs.prepare.outputs.package }}
      url: https://pypi.org/p/${{ needs.prepare.outputs.package }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      - name: Post webhook for failure
        if: failure()
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@0abb7fddabf2daa28da23b654ca8290e96294064 # v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
