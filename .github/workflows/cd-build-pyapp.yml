name: PyApp Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  VSVIEW_PYTHON_VERSION: "3.14"
  UV_NO_SYNC: true

jobs:
  build-windows:
    name: Windows x86_64
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        offline: ["offline", "online"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build PyApp binary
        id: build
        uses: ./.github/actions/build-pyapp
        with:
          rust-target: x86_64-pc-windows-msvc
          offline: ${{ matrix.offline == 'offline' }}
          windows-icon-path: ${{ github.workspace }}/src/pyapp/icons/windows/vsview.ico

      - name: Get VSView version
        id: version
        shell: bash
        run: echo "value=$(uvx hatch version)" >> "$GITHUB_OUTPUT"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsview-pyapp-${{ steps.version.outputs.value }}-windows-x86_64${{ matrix.offline == 'offline' && '-offline' || '' }}
          path: |
            dist/*.exe

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        offline: ["offline", "online"]

    name: Linux x86_64 (${{ matrix.offline }})
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build PyApp binary
        id: build
        uses: ./.github/actions/build-pyapp
        with:
          rust-target: x86_64-unknown-linux-gnu
          offline: ${{ matrix.offline == 'offline' }}

      - name: Package Linux distribution
        run: |
          EXEC=VSView${{ matrix.offline == 'offline' && '-offline' || '' }}
          mkdir -p dist/package/icons
          cp dist/$EXEC dist/package/
          cp src/pyapp/install.sh dist/package/
          cp -r src/pyapp/icons/linux/* dist/package/icons/
          chmod +x dist/package/install.sh dist/package/$EXEC

      - name: Get VSView version
        id: version
        shell: bash
        run: echo "value=$(uvx hatch version)" >> "$GITHUB_OUTPUT"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsview-pyapp-${{ steps.version.outputs.value }}-linux-x86_64${{ matrix.offline == 'offline' && '-offline' || '' }}
          path: dist/package/

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        offline: ["offline", "online"]

    name: macOS arm64 (${{ matrix.offline }})
    runs-on: macos-26

    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build PyApp binary
        id: build
        uses: ./.github/actions/build-pyapp
        with:
          rust-target: aarch64-apple-darwin
          offline: ${{ matrix.offline == 'offline' }}

      - name: Get VSView version
        id: version
        shell: bash
        run: echo "value=$(uvx hatch version)" >> "$GITHUB_OUTPUT"

      - name: Create macOS app bundle and DMG
        run: |
          EXEC=VSView${{ matrix.offline == 'offline' && '-offline' || '' }}

          uv run vsapp bundle dist/$EXEC ${{ steps.version.outputs.value }} \
            --env src/pyapp/.env.example \
            --iconset-dir src/pyapp/icons/macos/vsview.iconset \
            --output dist/AppBundle

          mkdir dmg_staging
          ditto dist/AppBundle dmg_staging/$EXEC.app
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname $EXEC -srcfolder dmg_staging -ov -format UDZO dist/$EXEC.dmg

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsview-pyapp-${{ steps.version.outputs.value }}-macos-arm64${{ matrix.offline == 'offline' && '-offline' || '' }}
          path: |
            dist/*.dmg
