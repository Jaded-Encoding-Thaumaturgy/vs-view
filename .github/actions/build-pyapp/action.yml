name: Build PyApp
description: Check out the project, set up build tools, and build both lightweight and offline PyApp binaries.

inputs:
  rust-target:
    description: Rust compilation target for the PyApp binary
    required: true
  offline:
    description: Whether to build a offline distribution
    required: false
  windows-icon-path:
    description: Windows icon path passed to PyApp
    required: false

runs:
  using: composite
  steps:
    - name: Git Submodule fetch
      shell: bash
      run: |
        git config --global --add safe.directory "*"
        git submodule update --init --recursive submodules/pyapp

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.14"
        enable-cache: false

    - name: Sync environment
      shell: bash
      run: uv sync --locked

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        target: ${{ inputs.rust-target }}
        rust-src-dir: submodules/pyapp

    - name: Build PyApp binary
      shell: bash
      env:
        PYAPP_WINDOWS_ICON_PATH: ${{ inputs.windows-icon-path }}
        PYAPP_BINARY_NAME: ${{inputs.offline == 'true' && 'VSView-offline' || 'VSView' }}
      run: >-
        uv run vsapp build
        ${{ inputs.offline == 'true' && '--offline' || '' }}
        ${{ !startsWith(github.ref, 'refs/tags/vsview/v') && '--fast-compress' || '' }}
