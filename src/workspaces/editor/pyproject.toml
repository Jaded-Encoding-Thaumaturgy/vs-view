[build-system]
requires = ["hatchling>=1.29.0", "packaging", "hatch-js>=0.1.2", "versioningit"]
build-backend = "hatchling.build"

[project]
name = "vsview-editor"
description = "Monaco-based code editor workspace for VSView"
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.12"
authors = [{ name = "Vardë", email = "ichunjo.le.terrible@gmail.com" }]
maintainers = [
    { name = "Vardë", email = "ichunjo.le.terrible@gmail.com" },
    { name = "Jaded Encoding Thaumaturgy", email = "jaded.encoding.thaumaturgy@gmail.com" },
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
    "Typing :: Typed",
]
dependencies = [
    "basedpyright>=1.39.9",
    "platformdirs>=4.11.0",
    "ruff>=0.16.0",
    "vsstubs>=2.2.0",
    "vsview>=0.9.0",
]
dynamic = ["version"]

[dependency-groups]
dev = ["hatchling", "packaging"]

[project.entry-points.vsview]
vsview_editor = "vsview_editor"

[tool.hatch.build.targets.wheel]
packages = ["src/python/vsview_editor"]
artifacts = ["src/python/vsview_editor/web_dist/"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.hooks.hatch-js]
path = "."
tool = "npm"
build_cmd = "build"
targets = ["src/python/vsview_editor/web_dist/index.html"]

[tool.hatch.version]
source = "versioningit"

[tool.versioningit.vcs]
match = ["vsview-editor/v*"]
default-tag = "vsview-editor/v0.0.0"

[tool.versioningit.tag2version]
rmprefix = "vsview-editor/v"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}+{vcs}{rev}"
dirty = "{next_version}+dirty"
distance-dirty = "{next_version}.dev{distance}+{vcs}{rev}.dirty"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "vite.config.ts" },
    { file = "ts/**/*.ts" },
    { file = "ts/**/*.json" },
    { file = "ts/**/*.js" },
    { file = "ts/index.css" },
    { file = "ts/index.html" },
]

[tool.uv.sources]
vsview = { workspace = true }
